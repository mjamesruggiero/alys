[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alys"
version = "0.1.0"
description = "Learning about my Spotify preferences from my streaming history. Can I do a better job than Spotify itself?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Ruggiero" }]
keywords = ["spotify", "recommender", "machine-learning", "eda", "matrix-factorization"]

# Core runtime deps. Behavioral-only modeling + Last.fm genre tags.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "pyyaml>=6.0",           # load config.yaml
    # enrichment
    "pylast>=5.2",              # Last.fm genre tags
    "requests>=2.31",
    "requests-cache>=1.2",     # cache API calls to disk
    "tenacity>=8.2",           # polite retries/backoff
    "python-dotenv>=1.0",      # load API keys from .env
    # viz
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
# Matrix factorization (Phase 6). Split out because `implicit` may lag on the
# newest Python releases; install when you reach that phase.
mf = [
    "implicit>=0.7",
]
# Notebooks / interactive work.
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
# Developer tooling.
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/mjamesruggiero/alys"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# sensible, not overbearing: pyflakes, pycodestyle, isort, bugbear, pyupgrade, comprehensions
select = ["E", "F", "I", "B", "UP", "C4", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["alys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]
